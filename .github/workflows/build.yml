      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VideoCompressor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCompressor-apk
          path: VideoCompressor.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest VideoCompressor.apk --repo "$GITHUB_REPOSITORY" \
            --title "Video Compressor (latest build)" \
            --notes "Download VideoCompressor.apk on your Android phone and install it."
